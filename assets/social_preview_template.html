<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    width: 1280px;
    height: 640px;
    background: #080b11;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* Radial glow background */
  .bg-glow-1 {
    position: absolute;
    top: -150px;
    right: 100px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(34, 139, 230, 0.18) 0%, rgba(34, 139, 230, 0) 70%);
    pointer-events: none;
  }
  .bg-glow-2 {
    position: absolute;
    bottom: -150px;
    left: 80px;
    width: 550px;
    height: 550px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(16, 185, 129, 0) 70%);
    pointer-events: none;
  }
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 85%);
  }

  /* Main Container */
  .card {
    position: relative;
    z-index: 10;
    width: 1140px;
    height: 500px;
    background: rgba(13, 17, 23, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 28px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 60px 70px;
    gap: 60px;
  }

  /* Left Logo Section */
  .logo-box {
    position: relative;
    flex-shrink: 0;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-ambient {
    position: absolute;
    inset: -20px;
    background: radial-gradient(circle, rgba(34, 139, 230, 0.45) 0%, rgba(34, 139, 230, 0) 70%);
    filter: blur(20px);
  }
  .logo-inner {
    position: relative;
    width: 170px;
    height: 170px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  .logo-inner svg {
    width: 110px;
    height: 110px;
    fill: #228be6;
    filter: drop-shadow(0 10px 18px rgba(34, 139, 230, 0.4));
  }

  /* Right Text Section */
  .content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex-grow: 1;
  }
  .badge-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: rgba(34, 139, 230, 0.12);
    border: 1px solid rgba(34, 139, 230, 0.3);
    border-radius: 9999px;
    font-size: 13px;
    font-weight: 600;
    color: #60a5fa;
    letter-spacing: 0.3px;
  }
  .pill.green {
    background: rgba(16, 185, 129, 0.12);
    border-color: rgba(16, 185, 129, 0.3);
    color: #34d399;
  }

  h1 {
    font-size: 58px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-bottom: 12px;
    background: linear-gradient(180deg, #ffffff 30%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h1 span {
    color: #228be6;
    -webkit-text-fill-color: #228be6;
  }
  .tagline {
    font-size: 21px;
    line-height: 1.45;
    color: #94a3b8;
    font-weight: 400;
    margin-bottom: 28px;
  }
  
  /* Features row */
  .features-row {
    display: flex;
    align-items: center;
    gap: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .feature-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #e2e8f0;
    font-weight: 500;
  }
  .feature-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #228be6;
    box-shadow: 0 0 8px #228be6;
  }
</style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-grid"></div>

  <div class="card">
    <div class="logo-box">
      <div class="logo-ambient"></div>
      <div class="logo-inner">
        <svg viewBox="0 0 72 72">
          <path d="M 19 13 C 14.037 13 10 17.038 10 22 L 10 49 C 10 49.217 10.017203 49.431531 10.033203 49.644531 L 15.496094 35.582031 C 17.286094 30.976031 21.636125 28 26.578125 28 L 59.988281 28 C 60.673281 28 61.343 28.086703 62 28.220703 L 62 26 C 62 21.038 57.963 17 53 17 L 32.753906 17 C 32.526906 17 32.307813 16.923203 32.132812 16.783203 L 29.869141 14.974609 C 28.280141 13.701609 26.283094 13 24.246094 13 L 19 13 z M 26.578125 32 C 23.299125 32 20.412609 33.97525 19.224609 37.03125 L 12.263672 54.947266 C 13.914672 56.814266 16.318 58 19 58 L 53.1875 58 C 56.5105 58 59.437531 55.998438 60.644531 52.898438 L 65.591797 40.173828 C 66.308797 38.326828 66.070172 36.247328 64.951172 34.611328 C 64.770172 34.346328 62.886281 32 59.988281 32 L 26.578125 32 z"/>
        </svg>
      </div>
    </div>

    <div class="content">
      <div class="badge-row">
        <span class="pill">🪟 Windows Desktop App</span>
        <span class="pill green">🔒 100% Offline & Private</span>
        <span class="pill">⚡ Automated Organizer</span>
      </div>
      
      <h1>FileFlow<span>.</span></h1>
      
      <p class="tagline">
        Intelligent automated file sorting, smart rule engine, and duplicate cleaner. Tame folder chaos forever.
      </p>

      <div class="features-row">
        <div class="feature-item">
          <div class="feature-dot"></div>
          <span>Automatic Origin Monitoring</span>
        </div>
        <div class="feature-item">
          <div class="feature-dot"></div>
          <span>PDF & EXIF Content Extraction</span>
        </div>
        <div class="feature-item">
          <div class="feature-dot"></div>
          <span>3-Stage Duplicate Cleaner</span>
        </div>
        <div class="feature-item">
          <div class="feature-dot"></div>
          <span>Free & Open Source</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
